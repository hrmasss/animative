<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" width="760" height="300" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">
  <title>No picture holds longer than 3.6 seconds</title>
  <rect width="760" height="300" rx="14" fill="#fbfaf7"/>
  <text x="28" y="40" font-size="17" font-weight="700" fill="#1f2328">Nothing sits still: one photo becomes several shots</text>
  <text x="28" y="62" font-size="12.5" fill="#6b7280">A still planned for 9 s is cut into parts of at most 3.6 s, each with a different crop and a different camera move.</text>

  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#b8cde0"/><stop offset="1" stop-color="#e9dcc4"/></linearGradient>
    <g id="photo">
      <rect width="200" height="112" fill="url(#sky)"/>
      <path d="M20 70 L120 58 L180 62 L120 66 Z" fill="#7d8796"/>
      <path d="M90 60 L104 30 L114 30 L106 60 Z" fill="#7d8796"/>
      <path d="M90 64 L104 94 L114 94 L106 64 Z" fill="#7d8796"/>
      <rect x="60" y="74" width="60" height="6" rx="3" fill="#3a3f47"/>
    </g>
    <marker id="m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#e8590c"/></marker>
  </defs>

  <g transform="translate(40,96)">
    <use href="#photo"/>
    <rect x="0" y="0" width="200" height="112" fill="none" stroke="#e8590c" stroke-width="2"/>
    <path d="M60 30 L40 18" stroke="#e8590c" stroke-width="2" marker-end="url(#m)"/>
    <path d="M140 82 L160 94" stroke="#e8590c" stroke-width="2" marker-end="url(#m)"/>
    <text x="100" y="138" font-size="12.5" font-weight="700" fill="#1f2328" text-anchor="middle">0 to 3 s · full frame</text>
    <text x="100" y="155" font-size="11.5" fill="#6b7280" text-anchor="middle">zoom in</text>
  </g>
  <g transform="translate(280,96)">
    <use href="#photo" opacity="0.35"/>
    <rect x="34" y="26" width="118" height="66" fill="none" stroke="#e8590c" stroke-width="2"/>
    <path d="M60 59 L126 59" stroke="#e8590c" stroke-width="2" marker-end="url(#m)"/>
    <text x="100" y="138" font-size="12.5" font-weight="700" fill="#1f2328" text-anchor="middle">3 to 6 s · crop on the wing</text>
    <text x="100" y="155" font-size="11.5" fill="#6b7280" text-anchor="middle">pan across</text>
  </g>
  <g transform="translate(520,96)">
    <use href="#photo" opacity="0.35"/>
    <rect x="46" y="56" width="96" height="40" fill="none" stroke="#e8590c" stroke-width="2"/>
    <path d="M94 76 L120 90" stroke="#e8590c" stroke-width="2" marker-end="url(#m)"/>
    <path d="M94 76 L68 62" stroke="#e8590c" stroke-width="2" marker-end="url(#m)"/>
    <text x="100" y="138" font-size="12.5" font-weight="700" fill="#1f2328" text-anchor="middle">6 to 9 s · tight on the missiles</text>
    <text x="100" y="155" font-size="11.5" fill="#6b7280" text-anchor="middle">zoom out</text>
  </g>
  <text x="28" y="282" font-size="11.5" fill="#6b7280">At 4.2 s with only a new camera move, review read it as one still held for 8 to 12 seconds. A new crop reads as a cut.</text>
</svg>
